<!DOCTYPE html>
<html lang="pt-AO"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dashboard — Cokylicious Admin</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/admin.css"></head><body>
<div class="admin-shell">
<aside class="admin-sidebar"></aside>
<main class="admin-main"><header class="admin-topbar"></header>
<div class="admin-content">
<div class="grid stats-grid">
<div class="stat-card"><span>Produtos disponíveis</span><strong id="totalProdutos">—</strong></div>
<div class="stat-card"><span>Categorias</span><strong id="totalCategorias">—</strong></div>
<div class="stat-card"><span>Combos</span><strong id="totalCombos">—</strong></div>
<div class="stat-card"><span>Fotos na galeria</span><strong id="totalGaleria">—</strong></div>
</div>
<div class="section-title"><h2>Produtos adicionados recentemente</h2><a class="btn btn-primary" href="produtos.html">Adicionar produto +</a></div>
<div class="panel"><div id="recentProdutos" class="grid"></div></div>
<div class="callout" style="margin-top:24px"><strong>Antes de publicar:</strong> confirma em <a href="configuracoes.html">Configurações</a> o WhatsApp, o telefone, a morada e o horário — hoje ainda têm valores de exemplo.</div>
</div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script src="../js/admin.js"></script><script>
(async()=>{await initAdminUI("dashboard","Dashboard");
const {data:pr}=await designeSupabase.from("produtos").select("id,disponivel");
const {data:ct}=await designeSupabase.from("categorias").select("id");
const {data:kb}=await designeSupabase.from("combos").select("id");
const {data:gl}=await designeSupabase.from("galeria").select("id");
const {data:recent,error:re}=await designeSupabase.from("produtos").select("id,nome,categoria_id,imagem_url,preco,created_at").order("created_at",{ascending:false}).limit(5);
if(re){adminToast("Não foi possível carregar alguns dados.","error");return}
document.getElementById("totalProdutos").textContent=(pr||[]).filter(p=>p.disponivel).length;
document.getElementById("totalCategorias").textContent=ct?.length??0;
document.getElementById("totalCombos").textContent=kb?.length??0;
document.getElementById("totalGaleria").textContent=gl?.length??0;
document.getElementById("recentProdutos").innerHTML=(recent||[]).length?recent.map(x=>`<div style="display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line2);padding:12px 0"><img class="thumb" src="${escapeHtml(x.imagem_url||"../assets/placeholder-burger.svg")}"><div><strong>${escapeHtml(x.nome)}</strong><div class="muted">${formatKz(x.preco)} · ${new Date(x.created_at).toLocaleDateString("pt-AO")}</div></div></div>`).join(""):'<div class="empty">Ainda não há produtos cadastrados.</div>';
})();
</script>
</body></html>
