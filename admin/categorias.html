<!DOCTYPE html>
<html lang="pt-AO"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Categorias — Cokylicious Admin</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/admin.css"></head><body>
<div class="admin-shell">
<aside class="admin-sidebar"></aside>
<main class="admin-main"><header class="admin-topbar"></header>
<div class="admin-content">
<div class="section-title" style="margin-top:0"><div><h2>Categorias</h2><p class="muted">São as abas do menu (ex.: Hambúrgueres, Bebidas). A ordem aqui é a ordem no site.</p></div><button class="btn btn-primary" id="newBtn">+ Adicionar categoria</button></div>
<div class="form-card" id="formCard" hidden>
<form id="catForm" class="form-grid">
<input type="hidden" id="id">
<div class="field"><label>Nome<input id="nome" required maxlength="60" placeholder="Ex.: Hambúrgueres"></label></div>
<div class="field"><label>Ícone<select id="emoji"><option value="">Automático (pelo nome)</option><option value="burger">Hambúrguer</option><option value="fries">Batatas / acompanhamentos</option><option value="cup">Bebida</option><option value="drumstick">Frango</option><option value="flame">Especial (chama)</option><option value="icecream">Sobremesa</option><option value="utensils">Talheres (genérico)</option></select></label></div>
<div class="field"><label>Ordem<input id="ordem" type="number" step="1" value="0"></label></div>
<label class="check"><input id="ativo" type="checkbox" checked> Ativa (aparece no site)</label>
<div class="field full"><div class="actions-row"><button class="btn btn-primary" id="save" type="submit">Guardar</button><button class="btn btn-secondary" type="button" id="cancel">Cancelar</button></div></div>
</form></div>
<div class="panel" style="margin-top:20px"><div class="table-wrap"><table class="admin-table"><thead><tr><th>Categoria</th><th>Ordem</th><th>Estado</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script src="../js/admin.js"></script><script>
(async()=>{await initAdminUI("categorias","Categorias");const formCard=document.getElementById("formCard"),form=document.getElementById("catForm"),rows=document.getElementById("rows");
function reset(){form.reset();id.value="";emoji.value="";ordem.value="0";ativo.checked=true;formCard.hidden=true}
async function load(){const {data,error}=await designeSupabase.from("categorias").select("*").order("ordem",{ascending:true});if(error){adminToast(error.message,"error");return}
rows.innerHTML=data.length?data.map(c=>`<tr><td><span class="cat-ico">${catIcon(c)}</span> <strong>${escapeHtml(c.nome)}</strong></td><td>${c.ordem}</td><td>${c.ativo?'<span class="pill on">Ativa</span>':'<span class="pill">Inativa</span>'}</td><td><div class="actions-row"><button class="btn btn-secondary edit" data-id="${c.id}">Editar</button><button class="btn ${c.ativo?'btn-danger':'btn-success'} toggle" data-id="${c.id}">${c.ativo?'Desativar':'Ativar'}</button><button class="btn btn-danger delete" data-id="${c.id}">Excluir</button></div></td></tr>`).join(""):'<tr><td colspan="4"><div class="empty">Ainda não há categorias.</div></td></tr>';
rows.querySelectorAll(".edit").forEach(b=>b.onclick=()=>edit(b.dataset.id));rows.querySelectorAll(".toggle").forEach(b=>b.onclick=()=>toggle(b.dataset.id));rows.querySelectorAll(".delete").forEach(b=>b.onclick=()=>del(b.dataset.id));}
async function edit(uid){const {data,error}=await designeSupabase.from("categorias").select("*").eq("id",uid).single();if(error)return adminToast(error.message,"error");id.value=data.id;nome.value=data.nome;emoji.value=data.emoji||"";ordem.value=data.ordem;ativo.checked=data.ativo;formCard.hidden=false;scrollTo({top:0,behavior:"smooth"})}
async function toggle(uid){const {data}=await designeSupabase.from("categorias").select("ativo").eq("id",uid).single();if(!data)return;const {error}=await designeSupabase.from("categorias").update({ativo:!data.ativo,updated_at:new Date().toISOString()}).eq("id",uid);if(error)adminToast(error.message,"error");else{adminToast("Estado atualizado.");load()}}
async function del(uid){if(!confirm("Excluir esta categoria? Os produtos ligados a ela ficam sem categoria."))return;const {error}=await designeSupabase.from("categorias").delete().eq("id",uid);if(error)adminToast(error.message,"error");else{adminToast("Categoria excluída.");load()}}
document.getElementById("newBtn").onclick=()=>{reset();formCard.hidden=false;scrollTo({top:0,behavior:"smooth"})};document.getElementById("cancel").onclick=reset;
form.onsubmit=async e=>{e.preventDefault();const save=document.getElementById("save");save.disabled=true;save.textContent="A guardar…";try{const payload={nome:nome.value.trim(),emoji:emoji.value.trim()||"",ordem:Number(ordem.value)||0,ativo:ativo.checked,updated_at:new Date().toISOString()};let error;if(id.value){({error}=await designeSupabase.from("categorias").update(payload).eq("id",id.value))}else{({error}=await designeSupabase.from("categorias").insert(payload))}if(error)throw error;adminToast("Categoria guardada com sucesso.");reset();load()}catch(e){adminToast(e.message||"Erro ao guardar categoria.","error")}finally{save.disabled=false;save.textContent="Guardar"}};
load();
})();
</script>
</body></html>
