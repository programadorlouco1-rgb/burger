<!DOCTYPE html>
<html lang="pt-AO"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Combos — Cokylicious Admin</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/admin.css"></head><body>
<div class="admin-shell">
<aside class="admin-sidebar"></aside>
<main class="admin-main"><header class="admin-topbar"></header>
<div class="admin-content">
<div class="section-title" style="margin-top:0"><div><h2>Combos</h2><p class="muted">Ex.: "Hambúrguer + Batata + Bebida". Aparecem na secção Combos do site.</p></div><button class="btn btn-primary" id="newBtn">+ Adicionar combo</button></div>
<div class="form-card" id="formCard" hidden>
<form id="comboForm" class="form-grid">
<input type="hidden" id="id"><input type="hidden" id="oldImage">
<div class="field full"><label>Foto</label><div class="file-row"><img class="preview" id="preview" src="../assets/placeholder-burger.svg" alt="Pré-visualização"><input id="image" type="file" accept="image/*"></div></div>
<div class="field"><label>Nome<input id="nome" required maxlength="80" placeholder="Ex.: Combo Solo"></label></div>
<div class="field"><label>Preço em Kz (opcional)<input id="preco" type="number" min="0" step="1"></label></div>
<div class="field full"><label>O que inclui<input id="itens" required maxlength="200" placeholder="Hambúrguer + Batata + Bebida"></label></div>
<div class="field"><label>Etiqueta (opcional)<input id="etiqueta" maxlength="30" placeholder="Ex.: Mais pedido"></label></div>
<div class="field"><label>Ordem<input id="ordem" type="number" step="1" value="0"></label></div>
<label class="check"><input id="ativo" type="checkbox" checked> Ativo (aparece no site)</label>
<div class="field full"><div class="actions-row"><button class="btn btn-primary" id="save" type="submit">Publicar</button><button class="btn btn-secondary" type="button" id="cancel">Cancelar</button></div></div>
</form></div>
<div class="panel" style="margin-top:20px"><div class="table-wrap"><table class="admin-table"><thead><tr><th>Combo</th><th>Preço</th><th>Estado</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script src="../js/admin.js"></script><script>
(async()=>{await initAdminUI("combos","Combos");const formCard=document.getElementById("formCard"),form=document.getElementById("comboForm"),rows=document.getElementById("rows"),image=document.getElementById("image"),preview=document.getElementById("preview");
function reset(){form.reset();id.value="";oldImage.value="";preview.src="../assets/placeholder-burger.svg";ativo.checked=true;ordem.value="0";formCard.hidden=true}
async function load(){const {data,error}=await designeSupabase.from("combos").select("*").order("ordem",{ascending:true});if(error){adminToast(error.message,"error");return}
rows.innerHTML=data.length?data.map(k=>`<tr><td><div class="cell-main"><img class="thumb" src="${escapeHtml(k.imagem_url||"../assets/placeholder-burger.svg")}"><div><strong>${escapeHtml(k.nome)}</strong><div class="muted">${escapeHtml(k.itens||"")}</div></div></div></td><td>${formatKz(k.preco)}</td><td>${k.ativo?'<span class="pill on">Ativo</span>':'<span class="pill">Inativo</span>'}</td><td><div class="actions-row"><button class="btn btn-secondary edit" data-id="${k.id}">Editar</button><button class="btn ${k.ativo?'btn-danger':'btn-success'} toggle" data-id="${k.id}">${k.ativo?'Desativar':'Ativar'}</button><button class="btn btn-danger delete" data-id="${k.id}">Excluir</button></div></td></tr>`).join(""):'<tr><td colspan="4"><div class="empty">Ainda não há combos.</div></td></tr>';
rows.querySelectorAll(".edit").forEach(b=>b.onclick=()=>edit(b.dataset.id));rows.querySelectorAll(".toggle").forEach(b=>b.onclick=()=>toggle(b.dataset.id));rows.querySelectorAll(".delete").forEach(b=>b.onclick=()=>del(b.dataset.id));}
async function edit(uid){const {data,error}=await designeSupabase.from("combos").select("*").eq("id",uid).single();if(error)return adminToast(error.message,"error");id.value=data.id;oldImage.value=data.imagem_url||"";nome.value=data.nome;itens.value=data.itens||"";preco.value=data.preco??"";etiqueta.value=data.etiqueta||"";ordem.value=data.ordem??0;ativo.checked=data.ativo;preview.src=data.imagem_url||"../assets/placeholder-burger.svg";formCard.hidden=false;scrollTo({top:0,behavior:"smooth"})}
async function toggle(uid){const {data}=await designeSupabase.from("combos").select("ativo").eq("id",uid).single();if(!data)return;const {error}=await designeSupabase.from("combos").update({ativo:!data.ativo,updated_at:new Date().toISOString()}).eq("id",uid);if(error)adminToast(error.message,"error");else{adminToast("Estado atualizado.");load()}}
async function del(uid){if(!confirm("Excluir este combo?"))return;const {data}=await designeSupabase.from("combos").select("imagem_url").eq("id",uid).single();const {error}=await designeSupabase.from("combos").delete().eq("id",uid);if(error)adminToast(error.message,"error");else{if(data?.imagem_url)deleteImageByUrl(data.imagem_url,"combos");adminToast("Combo excluído.");load()}}
image.onchange=()=>{if(image.files[0])preview.src=URL.createObjectURL(image.files[0])};document.getElementById("newBtn").onclick=()=>{reset();formCard.hidden=false;scrollTo({top:0,behavior:"smooth"})};document.getElementById("cancel").onclick=reset;
form.onsubmit=async e=>{e.preventDefault();const save=document.getElementById("save");save.disabled=true;save.textContent="A publicar…";try{let imageUrl=oldImage.value;if(image.files[0])imageUrl=await uploadImage(image.files[0],"combos","combos");const payload={nome:nome.value.trim(),itens:itens.value.trim(),etiqueta:etiqueta.value.trim(),preco:preco.value===""?null:Number(preco.value),imagem_url:imageUrl,ordem:Number(ordem.value)||0,ativo:ativo.checked,updated_at:new Date().toISOString()};let error;if(id.value){({error}=await designeSupabase.from("combos").update(payload).eq("id",id.value))}else{({error}=await designeSupabase.from("combos").insert(payload))}if(error)throw error;adminToast("Combo publicado com sucesso.");reset();load()}catch(e){adminToast(e.message||"Erro ao guardar combo.","error")}finally{save.disabled=false;save.textContent="Publicar"}};
load();
})();
</script>
</body></html>
